<div class="shell">
  <header class="topbar sb-anim sb-anim--fade sb-anim--2">
    <a class="brand" routerLink="/dashboard" title="Voltar ao painel">
      <span class="brand-mark material-symbols-rounded">menu_book</span>
      <span class="brand-texto">
        <strong>SpringBook</strong>
        <small>Gestão de livraria</small>
      </span>
    </a>

    <div class="topbar-acoes">
      @if (auth.usuario(); as usuario) {
        <button class="usuario" type="button" (click)="alternarMenu()"
                [attr.aria-expanded]="menuPerfilAberto" aria-label="Abrir menu do perfil">
          <span class="avatar">{{ usuario.nome.charAt(0) }}</span>
          <span class="usuario-dados">
            <strong>{{ usuario.nome }}</strong>
            <small [class.perfil-texto--admin]="auth.isAdmin()"
                   [class.perfil-texto--funcionario]="!auth.isAdmin()">
              {{ auth.isAdmin() ? 'Administrador' : 'Funcionário' }}
            </small>
          </span>
          <span class="material-symbols-rounded seta" [class.seta--aberta]="menuPerfilAberto">expand_more</span>
        </button>

        @if (menuPerfilAberto) {
          <div class="menu-overlay" (click)="fecharMenu()" aria-hidden="true"></div>

          <div class="menu-perfil" role="menu" aria-label="Perfil do usuário">
            <div class="menu-cabecalho">
              <span class="avatar avatar--grande">{{ usuario.nome.charAt(0) }}</span>
              <div class="menu-identificacao">
                <strong>{{ usuario.nome }}</strong>
                <small>{{ usuario.email }}</small>
                <span class="perfil-badge" [class.perfil-badge--admin]="auth.isAdmin()"
                      [class.perfil-badge--funcionario]="!auth.isAdmin()">
                  Logado como {{ auth.isAdmin() ? 'ADMIN' : 'FUNCIONÁRIO' }}
                </span>
              </div>
            </div>

            @if (auth.isAdmin()) {
              <a class="btn btn--primary menu-item" routerLink="/usuarios" (click)="fecharMenu()" role="menuitem">
                <span class="material-symbols-rounded">manage_accounts</span>
                Administração de usuários
              </a>
            }

            <button class="btn btn--sair menu-item" type="button" (click)="logout()" role="menuitem">
              <span class="material-symbols-rounded">logout</span>
              Sair
            </button>
          </div>
        }
      }
    </div>
  </header>

  <main class="conteudo sb-anim sb-anim--3">
    <router-outlet />
  </main>
</div>
