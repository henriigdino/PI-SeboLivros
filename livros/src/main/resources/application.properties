spring.application.name=livros

# Configuração do banco H2
# Cada pessoa usa seu próprio arquivo local. SEBO_DB_URL permite apontar para
# um servidor H2 TCP se o time quiser compartilhar um banco (uso avançado).
spring.datasource.url=${SEBO_DB_URL:jdbc:h2:file:./data/sebo_db}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuração do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Cria as tabelas (Hibernate) e depois aplica o data.sql (seed inicial)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Console web do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console